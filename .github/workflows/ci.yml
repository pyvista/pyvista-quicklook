name: CI

# `pull_request` is deliberately unfiltered: filtering it by base branch would
# skip every pull request in a stack that does not target main.
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nothing in CI is a terminal, so tools have to be told to colour their output.
  FORCE_COLOR: '1'
  PY_COLORS: '1'

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        # The package has no dependencies, so there is nothing worth caching.
        enable-cache: false
    - run: uvx pre-commit run --all-files --show-diff-on-failure --color=always
      env:
          # This hook exists to stop *local* commits straight to main; it
          # would always fail here since CI checks out that branch/tag directly.
        SKIP: no-commit-to-branch

  app:
      # Builds the real thing: compiles the app, the extensions app that holds them, both
      # extensions and the RenderScene tool, generates the Info.plist files, and ad-hoc
      # signs the bundle.
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        # The package has no dependencies, so there is nothing worth caching.
        enable-cache: false
    - run: uv sync --group dev
    - run: ./scripts/build.sh --universal
    - name: Check the bundle is complete and signed
      run: |
        app="build/PyVista Quick Look.app"
        appex="$app/Contents/Library/PyVista Quick Look Extensions.app/Contents/PlugIns/PyVistaQuickLookExtension.appex"
        test -x "$app/Contents/MacOS/PyVistaQuickLook"
        test -x "$appex/Contents/MacOS/PyVistaQuickLookExtension"
        codesign --verify --deep --strict "$app"
        # A preview extension is only registered by macOS when it is sandboxed.
        codesign -d --entitlements - "$appex" 2>&1 | grep -q app-sandbox
        # Both architectures, so the download runs on any Mac.
        lipo -archs "$appex/Contents/MacOS/PyVistaQuickLookExtension" | grep -q x86_64
        lipo -archs "$appex/Contents/MacOS/PyVistaQuickLookExtension" | grep -q arm64
    - run: uv run pytest tests/ --cov-report=xml --cov-fail-under=95
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7.1.1
      with:
        files: ./coverage.xml
        # A Codecov outage must not hold up a release.
        fail_ci_if_error: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    - name: Package the app
      run: ditto -c -k --keepParent "build/PyVista Quick Look.app" build/PyVistaQuickLook.zip
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: PyVistaQuickLook.zip
        path: build/PyVistaQuickLook.zip

  build:
    needs: [pre-commit, app]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        # The package has no dependencies, so there is nothing worth caching.
        enable-cache: false
    - run: uv build
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # release/v1

  release:
      # Attaches the built app and install.sh to the tag's release, so installing needs no compiler.
    needs: [app, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      with:
        name: PyVistaQuickLook.zip
    - env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      # Pushing the tag is enough: the release is created here unless one already exists.
      run: |
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
          || gh release create "$TAG" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
        gh release upload "$TAG" PyVistaQuickLook.zip install.sh --clobber --repo "$GITHUB_REPOSITORY"
