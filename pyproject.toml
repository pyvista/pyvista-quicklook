[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools>=64', 'setuptools_scm>=8']

[dependency-groups]
# The tests run the exporter under the same environment the installer builds.
dev = [
  'cvista[all]==9.7.0.4',
  'h5py',
  'pre-commit',
  'pytest',
  'pytest-cov',
  'pyvista-cad[step-light,3mf]',
  'pyvista-zstd==0.7.0',
  'pyvista[io,io-override]==0.49.0',
]

[project]
authors = [{ name = 'Erik Bedard' }]
classifiers = [
  'Development Status :: 4 - Beta',
  'Environment :: MacOS X',
  'Intended Audience :: Developers',
  'Intended Audience :: Science/Research',
  'Operating System :: MacOS :: MacOS X',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.14',
  'Topic :: Scientific/Engineering :: Visualization',
]
dependencies = []
description = 'Quick Look previews for PyVista-readable mesh files.'
dynamic = ['version']
keywords = ['macos', 'mesh', 'preview', 'pyvista', 'quicklook', 'vtk']
license = 'MIT'
name = 'pyvista-quicklook'
readme = 'README.md'
# One version throughout: the helper and the PyVista environment are the same Python.
requires-python = '>=3.14,<3.15'

[project.scripts]
pvql = 'pyvista_quicklook.cli:main'
# The render service runs under this name, which is what Login Items shows for it.
pyvista-quicklook-daemon = 'pyvista_quicklook.cli:main'

[project.urls]
Homepage = 'https://github.com/pyvista/pyvista-quicklook'

[tool.coverage.run]
branch = true
# The preload runs inside the PyVista environment's interpreter, which is not traced.
omit = ['*/_preload.py', '*/_version.py']
parallel = true
patch = ['subprocess']
source = ['pyvista_quicklook']

[tool.pytest.ini_options]
# The slowest tests, so a test that has grown slow is seen.
addopts = '--cov=pyvista_quicklook --durations=25'
filterwarnings = [
  'error',
  # lib3mf's ctypes structures trip a deprecation in Python 3.14; nothing here can fix it.
  "ignore:Due to '_pack_':DeprecationWarning:lib3mf",
]
markers = ['network: downloads an example dataset, so needs a connection']
testpaths = 'tests'
# One line per test, named as it starts, so a log shows which test a hang is in.
verbosity_test_cases = 1

[tool.ruff]
indent-width = 4
line-length = 99

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 75
quote-style = 'single'

[tool.ruff.lint]
extend-select = [
  'A',
  'B',
  'C4',
  'D',
  'E',
  'EM',
  'F',
  'FA',
  'I',
  'ICN',
  'N',
  'PERF',
  'PGH',
  'PIE',
  'PT',
  'RET',
  'RSE',
  'RUF',
  'SIM',
  'T10',
  'T20',
  'TCH',
  'TID',
  'UP',
  'W',
  'YTT',
]
ignore = ['D203', 'D211', 'D213']

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = true
force-sort-within-sections = true
required-imports = ['from __future__ import annotations']

[tool.ruff.lint.per-file-ignores]
# The command line interface reports its findings on stdout.
'pyvista_quicklook/cli.py' = ['T201']
'tests/*' = ['D103']

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.uv]
# PyVista requires stock VTK, which cvista replaces; without this every resolve installs both.
exclude-dependencies = ["vtk"]
required-version = ">=0.10"

[tool.setuptools]
license-files = ['LICENSE']
packages = ['pyvista_quicklook']

[tool.setuptools_scm]
version_scheme = 'release-branch-semver'
write_to = 'pyvista_quicklook/_version.py'
